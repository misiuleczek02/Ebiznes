version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "8080:8080"
    networks:
      - my-network

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    networks:
      - my-network
    depends_on:
      - server

networks:
  my-network:
    driver: bridge